{% extends 'base.html' %}

{% block title %}Můj profil - Panther Security{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 30px auto;">
    <div class="card" style="margin-bottom: 24px;">
        <h2 style="font-size: 20px; color: #fff; margin-bottom: 14px;">📱 Kontaktní údaje</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Telefon</label>
                {{ profile_form.phone }}
            </div>
            <div class="form-group">
                <label>E-mail</label>
                {{ profile_form.email }}
            </div>
            <div class="form-group">
                <label>Číslo bankovního účtu pro výplaty</label>
                {{ profile_form.bank_account }}
            </div>
            <button type="submit" name="update_profile" class="btn btn-primary" style="width: 100%;">
                Uložit kontaktní údaje
            </button>
        </form>
    </div>

    <div class="card">
        <h2 style="font-size: 20px; color: #fff; margin-bottom: 14px;">🔒 Změna hesla</h2>
        <form method="post">
            {% csrf_token %}
            {{ password_form.as_p }}
            <button type="submit" name="change_password" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">
                Změnit přístupové heslo
            </button>
        </form>
    </div>
</div>
{% endblock %}
