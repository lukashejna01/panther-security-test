{% extends 'base.html' %}

{% block title %}Přihlášení - Panther Security{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 60px auto 0;">
    <div class="card" style="padding: 36px 30px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <span class="brand-badge" style="margin-bottom: 12px; display: inline-block;">PŘIHLÁŠENÍ</span>
            <h2 style="font-size: 22px; color: #fff; margin: 0;">Vstup do portálu</h2>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Zadejte své služební údaje</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Uživatelské jméno</label>
                <input type="text" name="username" class="form-control" placeholder="např. jan.novak" required autofocus>
            </div>
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Heslo</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 14px;">
                Vstoupit do portálu
            </button>
        </form>
    </div>
</div>
{% endblock %}
